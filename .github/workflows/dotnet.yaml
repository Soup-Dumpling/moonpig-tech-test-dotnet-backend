name: .NET Workflow

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
    paths:
      - "Moonpig.PostOffice.Api/**"
      - "Moonpig.PostOffice.Core/**"
      - "Moonpig.PostOffice.Data/**"
      - "Moonpig.PostOffice.Infrastructure/**"
      - "Moonpig.PostOffice.Tests/**"
      - "Moonpig.PostOffice.sln"

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.x

      - name: Install dependencies
        run: dotnet restore Moonpig.PostOffice.sln
      - name: Build
        run: dotnet build --configuration Release --no-restore Moonpig.PostOffice.sln
      - name: Test
        run: dotnet test --no-restore --verbosity normal Moonpig.PostOffice.sln
